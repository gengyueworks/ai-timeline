<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 编年史 · AI Timeline — 一百年 AI 历史时间轴</title>
  <meta name="description" content="从图灵到 Agent，一百年的 AI 历史：116 个有来源依据的精选节点，双语呈现，可追溯、可探索，并连接配套 AI 词典。">
  <meta property="og:title" content="AI 编年史 · AI Timeline">
  <meta property="og:description" content="一百年的 AI 故事，串成一条可追溯的线索，陪你探索 AI 的宇宙。">
  <meta property="og:url" content="https://gengyueworks.github.io/ai-timeline/">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <style>
    :root {
      --paper: #f3efe4;
      --paper-2: #fffaf0;
      --ink: #17130d;
      --muted: #6f675b;
      --faint: #c9bea9;
      --line: #d8cbb5;
      --track: #002fa7;
      --red: #bd2f20;
      --green: #2f6d55;
      --card: rgba(255, 250, 240, 0.76);
      --serif: Georgia, "Songti SC", "STSong", serif;
      --sans: "Avenir Next", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --condensed: "Arial Narrow", "Avenir Next Condensed", "Roboto Condensed", var(--sans);
      --mono: "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      background:
        linear-gradient(90deg, rgba(23, 19, 13, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(23, 19, 13, 0.026) 1px, transparent 1px),
        var(--paper);
      background-size: 34px 34px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 6%, rgba(255, 255, 255, 0.58), transparent 30vw),
        linear-gradient(115deg, transparent 0 42%, rgba(255, 255, 255, 0.36) 43% 47%, transparent 48%);
      mix-blend-mode: soft-light;
    }

    button,
    input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    :focus-visible {
      outline: 2px solid var(--track);
      outline-offset: 2px;
      border-radius: 3px;
    }

    .shell {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 2px solid var(--ink);
      background: rgba(243, 239, 228, 0.92);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: 56px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 999px;
      color: var(--paper-2);
      background: var(--track);
      font-family: var(--mono);
      font-size: 11px;
      box-shadow: inset 0 0 0 4px rgba(255, 250, 240, 0.26);
    }

    .filters {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .filters::-webkit-scrollbar { display: none; }

    .chips {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .chip {
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 6px 13px;
      background: transparent;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 760;
      min-height: 42px;
      transition: transform 150ms ease, background 150ms ease, color 150ms ease;
    }

    .chip:hover,
    .chip.active {
      color: var(--paper-2);
      background: var(--ink);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .translate-mini {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }

    .translate-mini button {
      min-width: 30px;
      min-height: 30px;
      border: 1px solid rgba(23, 19, 13, 0.32);
      border-radius: 999px;
      padding: 5px 7px;
      color: var(--muted);
      background: rgba(255, 250, 240, 0.44);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      opacity: 0.68;
      transition: opacity 150ms ease, border-color 150ms ease, color 150ms ease, background 150ms ease;
    }

    .translate-mini button:hover {
      border-color: var(--track);
      color: var(--track);
      background: rgba(255, 250, 240, 0.78);
      opacity: 1;
    }

    .translate-mini button.active-lang {
      border-color: var(--track);
      color: var(--paper-2);
      background: var(--track);
      opacity: 1;
    }

    #google_translate_element,
    .goog-te-banner-frame,
    .goog-te-balloon-frame,
    .skiptranslate iframe {
      display: none !important;
    }

    body { top: 0 !important; }

    .search {
      width: min(236px, 24vw);
      min-height: 42px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--ink);
      background: rgba(255, 250, 240, 0.78);
      outline: none;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .search:focus { box-shadow: 0 0 0 3px rgba(0, 47, 167, 0.18); }

    .hero { padding: 38px 0 18px; }

    .kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--red);
      font-family: var(--condensed);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 38px;
      height: 5px;
      background: var(--red);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      gap: 34px;
      align-items: end;
      margin-top: 14px;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(32px, 4.7vw, 58px);
      line-height: 1;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .lead {
      max-width: 700px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .ledger {
      border: 2px solid var(--ink);
      background: var(--paper-2);
      box-shadow: 7px 7px 0 var(--track);
    }

    .ledger-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-bottom: 2px solid var(--ink);
      font-family: var(--condensed);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .stat {
      min-height: 76px;
      padding: 12px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child { border-right: 0; }

    .stat strong {
      display: block;
      font-family: var(--mono);
      font-size: 20px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .main-grid {
      display: block;
      padding: 18px 0 88px;
    }

    .timeline-wrap {
      width: min(930px, 100%);
      padding: 8px 0 22px;
    }

    .timeline-head {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 18px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .timeline-head strong {
      color: var(--ink);
      font-family: var(--condensed);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 20px;
      padding-bottom: 18px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 20px;
      width: 34px;
      border-radius: 999px;
      background: var(--track);
      box-shadow: inset 0 0 0 1px rgba(23, 19, 13, 0.1);
    }

    .timeline::after {
      content: "";
      position: absolute;
      top: 16px;
      bottom: 18px;
      left: 36px;
      width: 3px;
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.86);
    }

    .event {
      position: relative;
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 18px;
      min-height: 118px;
      content-visibility: auto;
      contain-intrinsic-size: auto 140px;
      scroll-margin-top: 76px;
    }

    .rail {
      position: relative;
      z-index: 2;
      width: 30px;
      height: 30px;
      margin: 22px 0 0 22px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 999px;
      color: var(--paper-2);
      background: var(--track);
      box-shadow: 0 0 0 4px var(--paper), inset 0 0 0 1px rgba(255, 250, 240, 0.45);
      font-size: 17px;
      line-height: 1;
    }

    .rail::before { content: "✦"; transform: translateY(-1px); }

    .event-card {
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
    }

    .event-inner {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 14px 0 16px;
      border-top: 2px solid var(--ink);
      transition: transform 160ms ease, background 160ms ease, padding 160ms ease;
    }

    .event-card:hover .event-inner,
    .event-card.active .event-inner {
      padding-left: 13px;
      padding-right: 13px;
      background: var(--card);
      transform: translateX(2px);
    }

    .year {
      color: var(--red);
      font-family: var(--condensed);
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
    }

    .date {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
    }

    .event-type {
      display: inline-flex;
      margin-bottom: 7px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--ink);
      background: var(--paper-2);
      font-size: 10px;
      font-weight: 820;
    }

    .event-card h3 {
      margin: 0;
      max-width: 740px;
      font-family: var(--condensed);
      font-size: clamp(20px, 2.2vw, 29px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .summary {
      max-width: 700px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .event-card.active .summary {
      max-width: 680px;
      color: #4a4034;
      font-size: 14px;
      line-height: 1.55;
    }

    .event-detail {
      display: none;
      grid-column: 2;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .event-card.active .event-detail { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(188px, 232px);
      gap: 42px;
      align-items: start;
    }

    .detail-main {
      display: grid;
      gap: 0;
      min-width: 0;
    }

    .detail-main .detail-label:not(:first-child) {
      margin-top: 20px;
    }

    .detail-label {
      margin: 0 0 6px;
      color: var(--red);
      font-family: var(--condensed);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .detail-text {
      margin: 0;
      color: #332d24;
      font-size: 13px;
    }

    .detail-sentence {
      margin: 0 0 0.55em;
      color: #332d24;
      font-size: 13px;
      line-height: 1.75;
    }

    .detail-sentence:last-child {
      margin-bottom: 0;
    }

    .detail-text + .detail-text {
      margin-top: 10px;
    }

    .learning-hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .subtimeline {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .subtimeline-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--ink);
      background: var(--paper-2);
      font-size: 12px;
      font-weight: 760;
      min-height: 42px;
      transition: transform 150ms ease, background 150ms ease;
    }

    .subtimeline-toggle:hover {
      background: rgba(255, 250, 240, 0.9);
      transform: translateY(-1px);
    }

    .subtimeline-toggle::before {
      content: "+";
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: var(--paper-2);
      background: var(--track);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1;
    }

    .subtimeline.open .subtimeline-toggle::before { content: "−"; }

    .subtimeline-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .subtimeline-item {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 12px;
      border-left: 3px solid var(--track);
      padding: 0 0 0 12px;
    }

    .subtimeline-date {
      color: var(--red);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.45;
    }

    .subtimeline-body h4 {
      margin: 0;
      font-family: var(--condensed);
      font-size: 16px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtimeline-body p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .detail-links {
      display: grid;
      gap: 9px;
    }

    .detail-side {
      border-left: 1px solid var(--line);
      padding-left: 18px;
    }

    .event-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .collapse-event {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      min-height: 40px;
    }

    .collapse-event:hover {
      border-color: var(--ink);
      color: var(--ink);
      background: var(--paper-2);
    }

    .term {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      color: var(--muted);
      background: rgba(255, 250, 240, 0.42);
      font-size: 12px;
      min-height: 44px;
      text-align: left;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .term:hover,
    .term.found:hover,
    .term.found {
      border-color: rgba(0, 47, 167, 0.62);
      color: var(--ink);
      background: rgba(255, 250, 240, 0.86);
      box-shadow: 4px 4px 0 rgba(0, 47, 167, 0.12);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .term strong {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #332d24;
      font-size: 12px;
      font-weight: 560;
      line-height: 1.3;
    }

    .term strong::after {
      content: "打开 →";
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10px;
      font-weight: 680;
      opacity: 0.58;
      transition: color 150ms ease, opacity 150ms ease, transform 150ms ease;
    }

    .term:hover strong::after,
    .term.found:hover strong::after {
      color: var(--track);
      opacity: 1;
      transform: translateX(2px);
    }

    .term span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      line-height: 1.3;
    }

    .term.review,
    .term.missing {
      cursor: default;
    }

    .term.review strong::after,
    .term.missing strong::after {
      content: "";
    }

    .term.review span,
    .term.missing span {
      color: var(--red);
      font-size: 10px;
      font-weight: 760;
    }

    .term.review {
      border-style: dashed;
    }

    .term.missing {
      border-style: dashed;
      background: rgba(255, 250, 240, 0.24);
    }

    .term.missing strong {
      color: var(--muted);
    }

    .empty,
    .status {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .hero-grid { grid-template-columns: 1fr; }
      .translate-mini {
        position: static;
        transform: none;
      }
      .filters {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 3px;
      }
      .search {
        width: 218px;
        flex: 0 0 auto;
      }
    }

    @media (max-width: 700px) {
      .shell { width: min(100% - 20px, 1120px); }
      .nav {
        align-items: flex-start;
        flex-wrap: wrap;
        padding: 10px 0;
      }
      .hero { padding-top: 28px; }
      .stats { grid-template-columns: 1fr; }
      .frontier-grid { grid-template-columns: 1fr; }
      .frontier-card { border-right: 0; }
      .stat { min-height: 58px; border-right: 0; border-bottom: 1px solid var(--line); }
      .stat:last-child { border-bottom: 0; }
      .timeline-head { grid-template-columns: 54px minmax(0, 1fr); }
      .timeline::before { left: 10px; width: 24px; }
      .timeline::after { left: 21px; width: 2px; }
      .event { grid-template-columns: 54px minmax(0, 1fr); gap: 8px; }
      .rail { width: 24px; height: 24px; margin-left: 10px; font-size: 14px; }
      .event-inner { grid-template-columns: 1fr; }
      .event-card:hover .event-inner,
      .event-card.active .event-inner {
        padding-left: 10px;
        padding-right: 10px;
      }
      .event-card h3 { font-size: 25px; }
      .event-detail { grid-column: 1; }
      .detail-grid { grid-template-columns: 1fr; }
      .subtimeline-item { grid-template-columns: 1fr; gap: 4px; }
      .detail-side {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        padding-left: 0;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="shell nav">
      <a class="brand" href="#" id="brand-link" aria-label="AI 时间轴">
        <span class="brand-mark">AI</span>
        <span id="brand-text">AI 时间轴</span>
      </a>
      <div class="filters" id="filters" aria-label="筛选时间轴">
        <div class="chips" id="filter-chips"></div>
        <input class="search" id="search" type="search" placeholder="搜索年份、事件、概念" aria-label="搜索年份、事件、概念">
        <span class="translate-mini" role="group" aria-label="语言切换">
          <button type="button" id="translate-zh" title="中文" aria-pressed="true">CH</button>
          <button type="button" id="translate-en" title="English" aria-pressed="false">EN</button>
        </span>
      </div>
    </nav>
  </header>

  <section class="shell hero">
    <div class="kicker" id="kicker">编年史</div>
    <div class="hero-grid">
      <div>
        <h1 id="site-title">AI 编年史</h1>
        <p class="lead" id="site-lead">一百年的 AI 故事，串成一条可追溯的线索，陪你探索 AI 的宇宙。</p>
      </div>
      <aside class="ledger" id="ledger" aria-label="时间轴统计">
        <div class="ledger-title">
          <span id="ledger-title-text">Index</span>
          <span id="date-range"></span>
        </div>
        <div class="stats">
          <div class="stat"><strong id="event-count">--</strong><span id="stat-events">历史节点</span></div>
          <div class="stat"><strong id="term-count">--</strong><span id="stat-terms">词典连接</span></div>
          <div class="stat"><strong id="match-count">--</strong><span id="stat-visible">当前显示</span></div>
        </div>
      </aside>
    </div>
  </section>

  <main class="shell main-grid">
    <section class="timeline-wrap">
      <div class="timeline-head">
        <strong>Line</strong>
        <span id="timeline-hint">点击年份节点后，可了解相关事件和词典入口。</span>
      </div>
      <div class="timeline" id="timeline" aria-label="AI 发展时间轴">
        <p class="status" id="status-loading">正在读取 AI 大事记数据。</p>
      </div>
    </section>
  </main>

  <script>
    const CATEGORY_KEYS = ["research", "model", "product", "infrastructure", "agent", "safety", "business"];

    const CATEGORY_LABELS = {
      research: { zh: "研究突破", en: "Research" },

    const state = {
      events: [],
      terms: [],
      reviewTerms: [],
      rawEvents: null,
      filter: "all",
      keyword: "",
      active: -1,
      openProductLines: new Set(),

      suppressAutoExpand: false
    };

    const t = () => LOCALES[state.lang];

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    async function loadJSON(path) {
      const response = await fetch(`${path}?t=${Date.now()}`);
      if (!response.ok) throw new Error(`Failed to load ${path}`);
      return response.json();
    }

    /* ---------- locale / meta ---------- */

    function applyLanguageMeta() {
      const lang = state.lang;
      const loc = LOCALES[lang];
      document.documentElement.lang = loc.htmlLang;
      document.title = loc.title;
      document.querySelector('meta[name="description"]').setAttribute("content", loc.metaDescription);
      document.querySelector('meta[property="og:title"]').setAttribute("content", loc.ogTitle);
      document.querySelector('meta[property="og:description"]').setAttribute("content", loc.ogDescription);
      const byId = id => document.getElementById(id);
      byId("brand-text").textContent = loc.brandText;
      byId("brand-link").setAttribute("aria-label", loc.brandAria);
      byId("kicker").textContent = loc.kicker;
      byId("site-title").textContent = loc.siteTitle;
      byId("site-lead").textContent = loc.siteLead;
      byId("ledger-title-text").textContent = loc.ledgerTitle;
      byId("stat-events").textContent = loc.statEvents;
      byId("stat-terms").textContent = loc.statTerms;
      byId("stat-visible").textContent = loc.statVisible;
      byId("timeline-hint").textContent = loc.timelineHint;
      byId("filters").setAttribute("aria-label", loc.filtersAria);
      byId("ledger").setAttribute("aria-label", loc.ledgerAria);
      byId("timeline").setAttribute("aria-label", loc.timelineAria);
      const search = byId("search");
      search.placeholder = loc.searchPlaceholder;
      search.setAttribute("aria-label", loc.searchAria);
      const langGroup = byId("filters").querySelector(".translate-mini");
      langGroup.setAttribute("aria-label", loc.langGroupAria);
      byId("translate-zh").title = loc.zhTitle;
      byId("translate-en").title = loc.enTitle;
      const status = byId("status-loading");
      if (status) status.textContent = loc.statusLoading;
    }

    function renderFilterChips() {
      const container = document.getElementById("filter-chips");
      const loc = t();
      const items = [["all", loc.filterAll], ...CATEGORY_KEYS.map(key => [key, CATEGORY_LABELS[key][state.lang]])];
      container.innerHTML = items.map(([key, label]) =>
        `<button class="chip ${state.filter === key ? "active" : ""}" type="button" data-filter="${key}" aria-pressed="${state.filter === key}">${escapeHTML(label)}</button>`
      ).join("");
    }

    function syncControls() {
      renderFilterChips();
      const search = document.getElementById("search");
      if (search.value !== state.keyword) search.value = state.keyword;
      document.getElementById("translate-en").classList.toggle("active-lang", state.lang === "en");
      document.getElementById("translate-zh").classList.toggle("active-lang", state.lang === "zh");
      document.getElementById("translate-en").setAttribute("aria-pressed", String(state.lang === "en"));
      document.getElementById("translate-zh").setAttribute("aria-pressed", String(state.lang === "zh"));
      applyLanguageMeta();
    }

    function setLang(lang) {
      if (state.lang === lang) return;
      state.lang = lang;
      state.active = -1;
      if (state.rawEvents) {
        state.events = state.rawEvents.map(normalizeEvent).sort((a, b) => timelineDateKey(a).localeCompare(timelineDateKey(b)));
      }
      syncControls();
      renderAll();
      syncURL();
    }

    /* ---------- URL persistence ---------- */

    function stateToURL() {
      const params = new URLSearchParams();
      if (state.lang !== "zh") params.set("lang", state.lang);
      if (state.filter !== "all") params.set("cat", state.filter);
      const keyword = state.keyword.trim();
      if (keyword) params.set("q", keyword);
      if (state.active !== -1) params.set("e", String(state.active));
      if (state.openProductLines.size) params.set("open", [...state.openProductLines].join(","));
      const qs = params.toString();
      return qs ? `${window.location.pathname}?${qs}` : window.location.pathname;
    }

    function applyURL(params) {
      state.filter = "all";
      state.keyword = "";
      state.active = -1;
      state.openProductLines = new Set();
      state.suppressAutoExpand = true;
      const lang = params.get("lang");
      if (lang === "en" || lang === "zh") state.lang = lang;
      const cat = params.get("cat");
      if (cat && CATEGORY_KEYS.includes(cat)) state.filter = cat;
      const keyword = params.get("q") || params.get("search");
      if (keyword !== null) state.keyword = keyword;
      const e = params.get("e");
      if (e !== null && e !== "" && !Number.isNaN(Number(e))) state.active = Number(e);
      const open = params.get("open");
      if (open) {
        open.split(",").forEach(v => {
          const n = Number(v);
          if (!Number.isNaN(n)) state.openProductLines.add(n);
        });
      }
    }

    let pushTimer = null;
    function syncURL() {
      const url = stateToURL();
      try {
        history.pushState({ aiTimeline: true }, "", url);
      } catch (error) {
        // 某些 file:// 环境可能禁止改写 URL，静默降级
      }
    }

    /* ---------- data normalization ---------- */

    function normalizeEvent(event, index) {
      const isEn = state.lang === "en";
      const relatedTerms = Array.isArray(event.related_terms) ? event.related_terms.filter(Boolean) : [];
      const sections = splitStorySections(event.summary_zh || "");
      const date = String(event.date || event.year || "");
      const year = String(event.year || "").replace(/\.0$/, "");
      const subtimeline = Array.isArray(event.subtimeline) ? event.subtimeline.map(item => ({
        date: String(item.date || ""),
        title: isEn ? (item.title_en || item.title_zh || "") : (item.title_zh || item.title_en || ""),
        titleEn: item.title_en || "",
        productLine: item.product_line || "",
        eventType: item.event_type || "",
        summary: isEn ? (item.summary_en || item.summary_zh || "") : (item.summary_zh || ""),
        why: isEn ? (item.why_it_matters_en || item.why_it_matters_zh || "") : (item.why_it_matters_zh || ""),
        tags: Array.isArray(item.capability_tags) ? item.capability_tags.filter(Boolean) : [],
        sourceName: item.source_name || "",
        sourceUrl: item.source_url || ""
      })) : [];
      const type = event.type || "research";
      const labelMap = CATEGORY_LABELS[type];
      return {
        index,
        date,
        displayDate: date && date !== year ? date : "",
        year,
        title: isEn ? (event.title_en || event.title_zh || "") : (event.title_zh || event.title_en || ""),
        titleEn: event.title_en || "",
        type,
        label: labelMap ? labelMap[isEn ? "en" : "zh"] : (event.type || (isEn ? "Milestone" : "历史节点")),
        summary: makeEventDeck(event, sections),
        what: isEn ? (event.summary_en || sections.what) : sections.what,
        story: isEn ? (event.context_en || event.behind_scenes_zh || sections.story) : (event.behind_scenes_zh || sections.story),
        why: isEn ? (event.why_it_matters_en || event.why_it_matters_zh || "") : (event.why_it_matters_zh || ""),
        terms: relatedTerms,
        missingTerms: Array.isArray(event.missing_terms) ? event.missing_terms.filter(Boolean) : [],
        tags: Array.isArray(event.tags) ? event.tags.filter(Boolean) : [],
        hint: event.learning_path_hint || "",
        sourceName: event.source_name || "",
        sourceUrl: event.source_url || "",
        confidence: event.confidence || "",
        importance: Number(event.importance || 3),
        subtimeline
      };
    }

    function splitStorySections(text) {
      const raw = String(text || "").trim();
      const result = { lead: raw, what: "", story: "" };
      if (!/(节点|这是什么)：/.test(raw) && !/背后(现场|故事)：/.test(raw)) return result;
      const whatMatch = raw.match(/(?:(?:节点|这是什么)：)?([\s\S]*?)(?=背后(?:现场|故事)：|$)/);
      const storyMatch = raw.match(/背后(?:现场|故事)：([\s\S]*)/);
      result.what = whatMatch ? whatMatch[1].trim() : "";
      result.story = storyMatch ? storyMatch[1].trim() : "";
      result.lead = result.what || raw;
      return result;
    }

    function normalizeWhitespace(text) {
      return String(text || "").replace(/\s+/g, " ").trim();
    }

    function firstReadableSentence(text) {
      const clean = normalizeWhitespace(cleanWhy(text).replace(/^(节点|这是什么)：/, "").replace(/^背后(现场|故事)：/, ""));
      const stripped = clean
        .replace(/学习者能先看到[^。！？；]*[。！？；]?/g, "")
        .replace(/先看「[^」]+」/g, "")
        .replace(/先看“[^”]+”/g, "")
        .replace(/先看『[^』]+』/g, "")
        .replace(/先看[^。！？；]*再/g, "再")
        .replace(/把时间轴先给出[^。！？；]*[。！？；]?/g, "")
        .trim();
      const match = stripped.match(/^(.{18,88}?[。！？；]|.{18,88}?\.)/);
      return match ? match[1].trim() : stripped.slice(0, 88).trim();
    }

    function makeEventDeck(event, sections) {
      const isEn = state.lang === "en";
      const curated = String(isEn ? (event.card_summary_en || "") : (event.card_summary_zh || "")).trim();
      if (curated) return curated;
      const src = isEn ? (event.summary_en || event.summary_zh || "") : (event.summary_zh || "");
      const lead = firstReadableSentence(sections.lead || src);
      return lead || firstReadableSentence(event.why_it_matters_zh || "") || firstReadableSentence(sections.story || "") || firstReadableSentence(sections.what || src) || "";
    }

    function cleanWhy(text, lang) {
      if (lang === "en") return String(text || "").trim();
      return String(text || "").replace(/^(为何重要|为什么重要)：/, "").trim();
    }

    function timelineDateKey(event) {
      const raw = String(event.date || event.year || "");
      if (/^\d{4}$/.test(raw)) return `${raw}-01-01`;
      if (/^\d{4}-\d{2}$/.test(raw)) return `${raw}-01`;
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
      return "9999-12-31";
    }

    async function loadTimeline() {
      const data = await loadJSON("ai-timeline-public.json");
      const rawEvents = Array.isArray(data.events) && data.events.length ? data.events : (data.timeline || []);
      return rawEvents;
    }

    async function loadDictionary() {
      try {
        const data = await loadJSON("https://gengyueworks.github.io/ai-dictionary/ai-dictionary-free.json");
        return (data.terms || []).filter(term => term && term.term);
      } catch (error) {
        return [];
      }
    }

    async function loadReviewTerms() {
      try {
        const data = await loadJSON("ai-dictionary-expansion-review-draft.json");
        return (data.items || []).filter(term => term && term.term);
      } catch (error) {
        return [];
      }
    }

    function findInList(list, label) {
      const needle = String(label || "").toLowerCase();
      return list.find(term => {
        const name = String(term.term || "").toLowerCase();
        const termId = String(term.id || "").toLowerCase();
        const aliases = Array.isArray(term.aliases) ? term.aliases : [];
        return name === needle || termId === needle || aliases.some(alias => String(alias).toLowerCase() === needle);
      });
    }

    function findTerm(label) {
      return findInList(state.terms, label);
    }

    function findReviewTerm(label) {
      return findInList(state.reviewTerms, label);
    }

    const GENERIC_LEARNING_TERMS = new Set([
      "AGI",
      "Benchmark",
      "AI Agent",
      "Prompt",
      "Training",
      "Pretraining",
      "Fine-tuning",
      "监督学习",
      "自监督学习",
      "强化学习",
      "RAG",
      "Memory",
      "Guardrail",
      "Safety Policy",
      "Latency",
      "Token",
      "LLM"
    ]);

    function eventKeyTerms(event, limit = 3) {
      const uniqueTerms = [...event.missingTerms, ...event.terms]
        .filter(Boolean)
        .filter((term, index, arr) => arr.indexOf(term) === index);
      const specificTerms = uniqueTerms.filter(term => !GENERIC_LEARNING_TERMS.has(term));
      return (specificTerms.length ? specificTerms : uniqueTerms).slice(0, limit);
    }

    function eventVisible(event) {
      const filterMatch = state.filter === "all" || event.type === state.filter;
      const keyword = state.keyword.trim().toLowerCase();
      const haystack = [
        event.date,
        event.year,
        event.title,
        event.titleEn,
        event.summary,
        event.why,
        event.label,
        event.hint,
        ...event.subtimeline.flatMap(item => [item.date, item.title, item.titleEn, item.productLine, item.summary, item.why, ...item.tags]),
        ...event.terms,
        ...event.missingTerms
      ].join(" ").toLowerCase();
      return filterMatch && (!keyword || haystack.includes(keyword));
    }

    function visibleEvents() {
      const keyword = state.keyword.trim().toLowerCase();
      const list = state.events.filter(eventVisible);
      if (!keyword) return list;
      return list.sort((a, b) => searchRank(a, keyword) - searchRank(b, keyword));
    }

    function searchRank(event, keyword) {
      const title = [event.title, event.titleEn].join(" ").toLowerCase();
      const terms = [...event.terms, ...event.missingTerms].join(" ").toLowerCase();
      const summary = [event.summary, event.why, event.hint].join(" ").toLowerCase();
      if (title.includes(keyword)) return 0;
      if (terms.split(/\s+/).includes(keyword)) return 1;
      if (terms.includes(keyword)) return 2;
      if (summary.includes(keyword)) return 3;
      return 4;
    }

    /* ---------- rendering ---------- */

    function renderStats() {
      const visible = visibleEvents();
      let connectionCount = 0;
      state.events.forEach(event => { connectionCount += event.terms.length; });
      document.getElementById("event-count").textContent = state.events.length;
      document.getElementById("term-count").textContent = connectionCount;
      document.getElementById("match-count").textContent = visible.length;
      if (state.events.length) {
        const first = state.events[0].year;
        const last = state.events[state.events.length - 1].year;
        document.getElementById("date-range").textContent = `${first} — ${last}`;
      }
    }

    function renderTerms(event) {
      const loc = t();
      const terms = eventKeyTerms(event, 3);
      if (!terms.length) return `<span class="empty">${escapeHTML(loc.emptyTerms)}</span>`;
      return terms.map(term => {
        const matched = findTerm(term);
        const review = matched ? null : findReviewTerm(term);
        const label = matched || review;
        const title = label && label.term_zh && label.term_zh !== term ? `${label.term_zh}（${term}）` : term;
        const aria = `${escapeHTML(title)}`;
        if (matched) {
          return `<button class="term found" type="button" data-term="${escapeHTML(term)}" aria-label="${aria} · ${loc.termOpen}"><strong>${escapeHTML(title)}</strong></button>`;
        }
        if (review) {
          return `<button class="term review" type="button" disabled aria-label="${aria} · ${loc.termReviewBadge}"><strong>${escapeHTML(title)}</strong><span>${escapeHTML(loc.termReview)}</span></button>`;
        }
        return `<button class="term missing" type="button" disabled aria-label="${aria} · ${loc.termMissing}"><strong>${escapeHTML(title)}</strong><span>${escapeHTML(loc.termMissing)}</span></button>`;
      }).join("");
    }

    function renderSubtimeline(event) {
      if (!event.subtimeline.length) return "";
      const loc = t();
      const isOpen = state.openProductLines.has(event.index);
      const label = isOpen ? loc.subtimelineOpen : loc.subtimelineExpand.replace("{n}", event.subtimeline.length);
      const list = isOpen ? `
        <div class="subtimeline-list">
          ${event.subtimeline.map(item => `
            <section class="subtimeline-item">
              <div class="subtimeline-date">${escapeHTML(item.date)}</div>
              <div class="subtimeline-body">
                <h4>${escapeHTML(item.title)}</h4>
                <p>${escapeHTML(item.summary)}</p>
                ${item.why ? `<p>${escapeHTML(item.why)}</p>` : ""}
              </div>
            </section>
          `).join("")}
        </div>
      ` : "";
      return `
        <div class="subtimeline ${isOpen ? "open" : ""}">
          <button class="subtimeline-toggle" type="button" data-subtimeline="${event.index}" aria-expanded="${isOpen}">${escapeHTML(label)}</button>
          ${list}
        </div>
      `;
    }

    function renderDetailBlock(label, text) {
      const paragraphs = String(text || "")
        .split(/\n{2,}/)
        .map(paragraph => paragraph.trim())
        .filter(Boolean);
      if (!paragraphs.length) return "";
      const sentenceize = paragraph =>
        String(paragraph)
          .split(/(?<=[。！？；])|(?<=[.!?])(?=\s|$)/)
          .map(s => s.trim())
          .filter(Boolean);
      return `
        ${label ? `<p class="detail-label">${escapeHTML(label)}</p>` : ""}
        ${paragraphs.map(paragraph =>
          sentenceize(paragraph)
            .map(sentence => `<p class="detail-sentence">${escapeHTML(sentence)}</p>`)
            .join("")
        ).join("")}
      `;
    }

    function renderTimeline() {
      const loc = t();
      const list = visibleEvents();
      if (state.keyword.trim() && list.length && state.active === -1 && !state.suppressAutoExpand) {
        state.active = list[0].index;
      }
      if (state.active !== -1 && !list.some(event => event.index === state.active)) {
        const chatGPT = list.find(event => event.date === "2022-11-30");
        state.active = (chatGPT || list[0] || { index: -1 }).index;
      }

      document.getElementById("timeline").innerHTML = list.map(event => `
        <article class="event" id="ev-${event.index}">
          <div class="rail" aria-hidden="true"></div>
          <article class="event-card ${event.index === state.active ? "active" : ""}" tabindex="0" data-index="${event.index}" aria-expanded="${event.index === state.active}">
            <div class="event-inner">
              <div>
                <span class="year">${escapeHTML(event.year)}</span>
                ${event.displayDate ? `<span class="date">${escapeHTML(event.displayDate)}</span>` : ""}
              </div>
              <div>
                <span class="event-type">${escapeHTML(event.label)}</span>
                <h3>${escapeHTML(event.title)}</h3>
                <p class="summary">${escapeHTML(event.summary)}</p>
                <div class="event-detail">
                  <div class="detail-grid">
                    <div class="detail-main">
                      ${renderDetailBlock(loc.detailBackstory, event.story)}
                      ${renderDetailBlock(loc.detailWhy, cleanWhy(event.why, state.lang))}
                      ${renderSubtimeline(event)}
                    </div>
                    <div class="detail-side">
                      <p class="detail-label">${loc.detailLearning}</p>
                      <div class="detail-links">${renderTerms(event)}</div>
                    </div>
                  </div>
                  <div class="event-actions">
                    <button class="collapse-event" type="button" data-collapse="${event.index}">${escapeHTML(loc.collapse)}</button>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </article>
      `).join("") || `<p class="empty">${escapeHTML(loc.emptyResult)}</p>`;

      document.querySelectorAll(".event-card").forEach(card => {
        card.addEventListener("click", () => {
          state.active = Number(card.dataset.index);
          renderAll();
          syncURL();
        });
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            state.active = Number(card.dataset.index);
            renderAll();
            syncURL();
          }
        });
      });

      document.querySelectorAll("[data-term]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const term = findTerm(button.dataset.term);
          if (term) {
            const url = `https://gengyueworks.github.io/ai-dictionary/ai-dictionary-lab.html?term=${encodeURIComponent(term.term)}&from=timeline`;
            window.location.href = url;
          }
        });
      });

      document.querySelectorAll("[data-subtimeline]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const index = Number(button.dataset.subtimeline);
          if (state.openProductLines.has(index)) {
            state.openProductLines.delete(index);
          } else {
            state.openProductLines.add(index);
          }
          renderAll();
          syncURL();
        });
      });

      document.querySelectorAll("[data-collapse]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          state.active = -1;
          state.suppressAutoExpand = true;
          renderAll();
          syncURL();
        });
      });
    }

    function renderAll() {
      renderStats();
      renderTimeline();
    }

    function bindEvents() {
      document.getElementById("filter-chips").addEventListener("click", event => {
        const chip = event.target.closest("[data-filter]");
        if (!chip) return;
        state.filter = chip.dataset.filter;
        renderFilterChips();
        renderAll();
        syncURL();
      });

      const search = document.getElementById("search");
      search.addEventListener("input", () => {
        state.keyword = search.value;
        state.active = -1;
        state.suppressAutoExpand = false;
        renderAll();
        clearTimeout(pushTimer);
        pushTimer = setTimeout(syncURL, 350);
      });

      document.getElementById("translate-en").addEventListener("click", () => setLang("en"));
      document.getElementById("translate-zh").addEventListener("click", () => setLang("zh"));

      window.addEventListener("popstate", () => {
        const params = new URLSearchParams(window.location.search);
        applyURL(params);
        if (state.rawEvents) {
          state.events = state.rawEvents.map(normalizeEvent).sort((a, b) => timelineDateKey(a).localeCompare(timelineDateKey(b)));
        }
        syncControls();
        renderAll();
        const active = document.querySelector(`[data-index="${state.active}"]`);
        if (active) active.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    async function main() {
      applyURL(new URLSearchParams(window.location.search));
      bindEvents();
      try {
        const [timeline, dictionary, reviewTerms] = await Promise.all([loadTimeline(), loadDictionary(), loadReviewTerms()]);
        state.rawEvents = timeline;
        state.events = timeline.map(normalizeEvent).sort((a, b) => timelineDateKey(a).localeCompare(timelineDateKey(b)));
        state.terms = dictionary;
        state.reviewTerms = reviewTerms;
        syncControls();
        renderAll();
        const active = document.querySelector(`[data-index="${state.active}"]`);
        if (active) active.scrollIntoView({ behavior: "auto", block: "start" });
      } catch (error) {
        document.getElementById("timeline").innerHTML = `<p class="empty">${escapeHTML(t().loadError)}</p>`;
      }
    }

    main();
  </script>
</body>
</html>
